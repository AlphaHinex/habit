name: Build

on:
  push:
    branches:
      - main
      - master
    # 仅当 Go 文件发生变化时触发（分支 push）
    paths:
      - '**/*.go'
    # 同时允许 tag push 触发（用于 release），不受 paths 影响
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd lark-ws 
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "../lark-ws-${GOOS}-${GOARCH}${ext}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lark-ws-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lark-ws-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
